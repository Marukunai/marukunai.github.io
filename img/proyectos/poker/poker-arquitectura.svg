<svg width="100%" viewBox="0 0 680 580" role="img" style="" xmlns="http://www.w3.org/2000/svg">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(231, 236, 242);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Arquitectura del backend de poker_online</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(231, 236, 242);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Diagrama de arquitectura: un cliente web o móvil futuro se conecta vía REST y WebSocket a un backend Spring Boot 3 en Java 17, que contiene una capa de seguridad JWT y WebSocket STOMP, los módulos de dominio (mesas, torneos, logros, moderación, amigos, bots, chat, estadísticas), jobs programados, y persiste en MySQL 8 vía JPA/Hibernate.</desc>
